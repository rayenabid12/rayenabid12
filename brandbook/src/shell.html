</main>

<script>
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var total = slides.length;
  slides.forEach(function (s, i) {
    var wrap = document.createElement('div');
    wrap.className = 'frame';
    s.parentNode.insertBefore(wrap, s);
    wrap.appendChild(s);
    if (s.hasAttribute('data-nofooter')) return;
    var f = document.createElement('footer');
    f.className = 'ft';
    f.innerHTML = '<span>Para Elixea · Charte graphique</span><span>' + (s.getAttribute('data-chapter') || '') +
      '</span><span class="pg">' + String(i + 1).padStart(2, '0') + ' / ' + total + '</span>';
    s.appendChild(f);
  });

  function hex(n) { return Math.round(n).toString(16).padStart(2, '0'); }
  document.querySelectorAll('[data-tint]').forEach(function (el) {
    var c = el.getAttribute('data-tint').replace('#', '');
    var amt = parseFloat(el.getAttribute('data-mix'));
    var target = amt >= 0 ? 255 : 0;
    var a = Math.abs(amt);
    var rgb = [0, 2, 4].map(function (k) { var v = parseInt(c.substr(k, 2), 16); return v + (target - v) * a; });
    var h = '#' + rgb.map(hex).join('').toUpperCase();
    el.style.background = h;
    var lab = el.querySelector('.hex');
    if (lab) lab.textContent = h;
    var lum = (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255;
    el.style.color = lum > 0.6 ? '#0E3442' : '#F5F3EF';
  });

  function fit() {
    var f = document.querySelector('.frame');
    if (!f) return;
    document.documentElement.style.setProperty('--s', f.clientWidth / 1920);
  }
  fit();
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.querySelector('.deck'));
})();
</script>
