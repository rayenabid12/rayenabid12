<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="render-scale" content="1,2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,700;1,800&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="base.css">
<style>
  .tile { position: absolute; overflow: hidden; border-radius: 6px; }
  .shot { background-repeat: no-repeat; }
  .chip { position: absolute; left: 10px; bottom: 10px; font: 700 8px Roboto; letter-spacing: .24em; text-transform: uppercase; color: #F2EEE7; background: rgba(18,18,17,.82); padding: 5px 7px; border-radius: 3px; }
</style>
</head>
<body>
<!-- Behance project cover (808 x 632): a bento board showing the whole identity at a glance -->
<div class="scene" data-out="behance-cover-branding" style="width:808px;height:632px;background:#121211">

  <!-- A1: the emblem -->
  <div class="tile grain" style="left:8px;top:8px;width:400px;height:432px;background:radial-gradient(ellipse 70% 60% at 50% 45%, #2E2D2A 0%, #161615 75%)">
    <div class="abs" style="left:330px;top:-20px;width:200px;height:480px;background:#BC3333;transform:skewX(-14deg)"></div>
    <img class="abs" src="../../assets/logo/emblem-red.png" style="left:50%;top:50%;width:300px;transform:translate(-50%,-50%);filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))">
  </div>

  <!-- A2: title -->
  <div class="tile" style="left:8px;top:448px;width:400px;height:176px;background:#1D1D1B;padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between">
    <div class="eyebrow" style="color:#BC3333;font-size:9px;letter-spacing:.34em">Muscle Stock · Tunisie</div>
    <div class="display" style="font-size:62px;color:#F2EEE7;line-height:.88">BRAND<br>IDENTITY</div>
  </div>

  <!-- B1: storefront -->
  <div class="tile shot" style="left:416px;top:8px;width:384px;height:200px;background-image:url(../out/storefront.jpg);background-size:560px auto;background-position:-88px -18px">
    <div class="chip">Enseigne</div>
  </div>

  <!-- B2a: palette -->
  <div class="tile" style="left:416px;top:216px;width:188px;height:200px;display:flex">
    <div style="flex:3;background:#BC3333;position:relative"><div class="abs" style="left:8px;bottom:10px;font:700 8px Roboto;color:#F2EEE7;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.12em">#BC3333</div></div>
    <div style="flex:2;background:#1D1D1B;border-left:1px solid #333;position:relative"><div class="abs" style="left:6px;bottom:10px;font:700 8px Roboto;color:#F2EEE7;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.12em">#1D1D1B</div></div>
    <div style="flex:2;background:#F2EEE7;position:relative"><div class="abs" style="left:6px;bottom:10px;font:700 8px Roboto;color:#1D1D1B;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.12em">#F2EEE7</div></div>
    <div style="flex:1;background:#1F3A93"></div>
  </div>

  <!-- B2b: type + app icon -->
  <div class="tile" style="left:612px;top:216px;width:188px;height:200px;background:#F2EEE7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px">
    <img src="../out/app-icon.png" style="width:78px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))">
    <div class="display" style="font-size:40px;color:#1D1D1B;text-transform:none">Aa<span style="color:#BC3333">123</span></div>
    <div class="eyebrow" style="font-size:7px;color:#6A6862;letter-spacing:.28em">Barlow Condensed · Roboto</div>
  </div>

  <!-- B3a: apparel -->
  <div class="tile shot" style="left:416px;top:424px;width:188px;height:200px;background-image:url(../out/apparel.jpg);background-size:520px auto;background-position:-20px -40px">
    <div class="chip">Textile</div>
  </div>

  <!-- B3b: stationery -->
  <div class="tile shot" style="left:612px;top:424px;width:188px;height:200px;background-image:url(../out/stationery.jpg);background-size:440px auto;background-position:-90px -20px">
    <div class="chip">Papeterie</div>
  </div>
</div>
</body>
</html>
