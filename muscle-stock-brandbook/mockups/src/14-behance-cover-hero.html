<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="render-scale" content="1,2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,700;1,800&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="base.css">
</head>
<body>
<!-- Behance cover v3 (808 x 632): logo + title on the left, AI product photo on the right -->
<div class="scene grain" data-out="behance-cover-hero" style="width:808px;height:632px;background:#121211">
  <!-- product photo, cut by the 14° brand angle -->
  <div class="abs" style="left:300px;top:-20px;width:620px;height:680px;overflow:hidden;transform:skewX(-14deg);transform-origin:bottom">
    <div class="abs" style="left:-60px;top:0;width:700px;height:680px;transform:skewX(14deg);transform-origin:bottom;background:url(../../openart/generated/product-tubs.jpg) 55% 70%/cover"></div>
  </div>
  <div class="abs" style="left:290px;top:-20px;width:12px;height:680px;background:#BC3333;transform:skewX(-14deg);transform-origin:bottom"></div>
  <div class="abs" style="left:300px;top:0;width:520px;height:632px;background:linear-gradient(90deg, rgba(18,18,17,.55), rgba(18,18,17,0) 35%)"></div>

  <!-- identity -->
  <div class="abs" style="left:44px;top:46px;width:330px;display:flex;flex-direction:column;align-items:flex-start">
    <img src="../../assets/logo/icon-color.png" style="width:96px">
    <img src="../../assets/logo/wordmark-white.png" style="width:250px;margin-top:22px">
    <div class="eyebrow" style="color:#BC3333;font-size:9px;letter-spacing:.38em;margin-top:10px">Sports nutrition · Tunisia</div>
    <div class="display" style="font-size:92px;color:#F2EEE7;margin-top:58px;line-height:.86">BRAND<br>IDENTITY</div>
  </div>
  <div class="abs" style="left:44px;bottom:42px;display:flex;align-items:center;gap:8px">
    <div style="width:18px;height:18px;border-radius:50%;background:#BC3333"></div>
    <div style="width:18px;height:18px;border-radius:50%;background:#1D1D1B;border:1px solid #4a4945"></div>
    <div style="width:18px;height:18px;border-radius:50%;background:#F2EEE7"></div>
    <div style="width:18px;height:18px;border-radius:50%;background:#1F3A93"></div>
    <div class="eyebrow" style="font-size:9px;color:#8C8A85;letter-spacing:.3em;margin-left:10px">Brand book 2.0 · 2026</div>
  </div>
</div>
</body>
</html>
