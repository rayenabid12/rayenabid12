<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="render-scale" content="1,2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,700;1,800&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="base.css">
<script src="kit.js"></script>
</head>
<body>
<!-- Behance project cover, 808 x 632 -->
<div id="s" class="scene grain" data-out="behance-cover" style="width:808px;height:632px;background:radial-gradient(ellipse 80% 70% at 30% 30%, #262523 0%, #121211 70%)">
  <!-- red slab with duotone photo -->
  <div class="abs" style="left:430px;top:-20px;width:560px;height:680px;background:#BC3333;transform:skewX(-14deg);transform-origin:bottom;overflow:hidden">
    <div class="abs" style="left:-80px;top:0;width:720px;height:680px;background:url(../../assets/photo/hero-torso.jpg) 30% center/cover;filter:grayscale(1) contrast(1.3) brightness(1.2);mix-blend-mode:multiply;opacity:.55;transform:skewX(14deg)"></div>
  </div>
  <div class="abs" style="left:404px;top:-20px;width:10px;height:680px;background:#BC3333;transform:skewX(-14deg);transform-origin:bottom"></div>

  <!-- left: identity -->
  <div class="abs" style="left:48px;top:48px;width:380px;display:flex;flex-direction:column;align-items:flex-start">
    <img src="../../assets/logo/icon-color.png" style="width:92px">
    <img src="../../assets/logo/wordmark-white.png" style="width:300px;margin-top:26px">
    <div class="eyebrow" style="color:#BC3333;font-size:11px;letter-spacing:.42em;margin-top:12px">Nutrition sportive · Tunisie</div>
    <div class="display" style="font-size:96px;color:#F2EEE7;margin-top:52px">BRAND<br>IDENTITY</div>
    <div class="display" style="font-size:40px;color:#BC3333;margin-top:6px">& PACKAGING</div>
  </div>
  <div class="abs" style="left:48px;bottom:44px;display:flex;gap:8px">
    <div class="eyebrow" style="font-size:10px;color:#F2EEE7;border:1px solid #4a4945;padding:7px 10px">Logo</div>
    <div class="eyebrow" style="font-size:10px;color:#F2EEE7;border:1px solid #4a4945;padding:7px 10px">Packaging</div>
    <div class="eyebrow" style="font-size:10px;color:#F2EEE7;border:1px solid #4a4945;padding:7px 10px">Merch</div>
    <div class="eyebrow" style="font-size:10px;color:#F2EEE7;border:1px solid #4a4945;padding:7px 10px">Digital</div>
  </div>
</div>
<script>
  const s = document.getElementById('s');
  const floor = 590;
  // recovery tub behind on the left, performance hero, creatine jar in front
  shadowUnder(s, 418, floor - 30, 170, 0.16);
  tub(s, { x: 418, y: floor - 30 - Math.round(170 * 1.32), w: 170, line: 'recovery', product: 'WHEY', variant: 'ISOLATE', flavour: 'VANILLE', weight: '2,27 KG' });
  shadowUnder(s, 505, floor, 240, 0.16);
  tub(s, { x: 505, y: floor - Math.round(240 * 1.32), w: 240, line: 'performance', product: 'WHEY', variant: 'GOLD', flavour: 'CHOCOLAT', weight: '2,27 KG · 5 LB' });
  shadowUnder(s, 668, floor + 10, 118, 0.16);
  tub(s, { x: 668, y: floor + 10 - 118, w: 118, short: true, line: 'essentials', product: 'CRÉATINE', variant: 'MONO', flavour: 'NEUTRE', weight: '300 G' });
</script>
</body>
</html>
