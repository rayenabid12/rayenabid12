<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,700;1,800&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="base.css">
<style>
  .shaker { position: absolute; }
  .shaker .cap { position: absolute; left: 6%; right: 6%; top: 6%; height: 15%; border-radius: 18px 18px 6px 6px; background: repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 9px, rgba(0,0,0,.16) 9px 11px), #BC3333; }
  .shaker .spout { position: absolute; left: 56%; width: 22%; top: 0; height: 10%; border-radius: 10px 10px 2px 2px; background: #a52b2b; }
  .shaker .ring { position: absolute; left: 4%; right: 4%; top: 20%; height: 4%; border-radius: 4px; background: #9e2a2a; }
  .shaker .cup { position: absolute; left: 3%; right: 3%; top: 23.5%; bottom: 0; background: #161615; clip-path: polygon(0 0, 100% 0, 93% 100%, 7% 100%); border-radius: 0 0 30px 30px; overflow: hidden; }
  .bottle { position: absolute; }
  .bottle .capb { position: absolute; left: 30%; right: 30%; top: 0; height: 12%; border-radius: 10px 10px 4px 4px; background: repeating-linear-gradient(90deg, rgba(255,255,255,0) 0 6px, rgba(255,255,255,.08) 6px 8px), #1D1D1B; }
  .bottle .bodyb { position: absolute; left: 0; right: 0; top: 11%; bottom: 0; border-radius: 46% 46% 36px 36px / 22% 22% 36px 36px; background: #ECE8E1; overflow: hidden; }
</style>
</head>
<body>
<div id="s" class="scene grain" data-out="shaker-bottle" style="width:1600px;height:1000px;background:radial-gradient(ellipse 55% 60% at 50% 40%, #2c2b29 0%, #151514 60%, #0b0b0a 100%)">
  <div class="abs" style="left:0;right:0;bottom:0;height:17%;background:linear-gradient(180deg,#121211,#0a0a09);border-top:1px solid rgba(255,255,255,.05)"></div>
  <!-- red rim light -->
  <div class="abs" style="left:220px;top:80px;width:520px;height:820px;border-radius:50%;background:radial-gradient(ellipse, rgba(188,51,51,.35), rgba(188,51,51,0) 65%)"></div>

  <div class="contact-shadow" style="left:330px;top:810px;width:420px;height:70px"></div>
  <div class="shaker" style="left:370px;top:160px;width:340px;height:670px">
    <div class="spout"><div class="cyl-shade soft"></div></div>
    <div class="cap"><div class="cyl-shade soft" style="border-radius:18px 18px 6px 6px"></div></div>
    <div class="ring"></div>
    <div class="cup">
      <div class="abs" style="right:13%;top:6%;display:flex;flex-direction:column;gap:22px;align-items:flex-end">
        <div style="width:34px;height:2px;background:#5a5955"></div><div style="width:20px;height:2px;background:#5a5955"></div>
        <div style="width:34px;height:2px;background:#5a5955"></div><div style="width:20px;height:2px;background:#5a5955"></div>
        <div style="width:34px;height:2px;background:#5a5955"></div><div style="width:20px;height:2px;background:#5a5955"></div>
      </div>
      <div class="abs" style="left:0;right:0;top:22%;display:flex;flex-direction:column;align-items:center">
        <img src="../../assets/logo/icon-red-knockout.png" style="width:190px">
        <img src="../../assets/logo/wordmark-white.png" style="width:200px;margin-top:22px">
        <div class="eyebrow" style="color:#8C8A85;margin-top:12px;font-size:10px">700 ML · SANS BPA</div>
      </div>
      <div class="abs" style="left:-10%;right:-10%;bottom:9%;height:3%;background:#BC3333;transform:skewY(-7deg)"></div>
      <div class="cyl-shade"></div>
    </div>
  </div>

  <div class="contact-shadow" style="left:880px;top:820px;width:330px;height:60px"></div>
  <div class="bottle" style="left:910px;top:250px;width:270px;height:590px">
    <div class="capb"><div class="cyl-shade soft"></div></div>
    <div class="bodyb">
      <div class="abs" style="left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center">
        <img src="../../assets/logo/icon-red-knockout.png" style="width:150px">
        <img src="../../assets/logo/wordmark-black.png" style="width:170px;margin-top:20px">
        <div class="display" style="font-size:30px;color:#BC3333;margin-top:16px">LA FORCE, EN STOCK.</div>
      </div>
      <div class="cyl-shade" style="opacity:.55"></div>
    </div>
  </div>
</div>
</body>
</html>
