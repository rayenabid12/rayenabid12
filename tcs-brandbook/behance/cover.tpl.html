<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:808px;height:632px;overflow:hidden;font-family:Montserrat,sans-serif;color:#fff}
.c{position:relative;width:808px;height:632px;overflow:hidden;background:radial-gradient(110% 95% at 78% 18%,#5d3180 0%,#46225F 36%,#31253D 72%,#1D1526 100%)}
.pat{position:absolute;inset:0;opacity:.6}
.mark{position:absolute;left:318px;top:84px;width:580px;height:320px;filter:drop-shadow(0 30px 50px rgba(15,8,25,.55))}
.mono{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#A4ACD1}
.top{position:absolute;left:44px;top:40px;right:44px;display:flex;justify-content:space-between}
h1{position:absolute;left:44px;bottom:92px;font-weight:800;font-size:58px;line-height:.94;letter-spacing:-.035em}
h1 span{color:#A4ACD1}
.foot{position:absolute;left:44px;bottom:42px;display:flex;gap:10px}
.foot i{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#DCD7EA;border:1px solid rgba(164,172,209,.35);border-radius:999px;padding:6px 11px}
.card{position:absolute;right:40px;bottom:40px;width:262px;background:rgba(29,21,38,.92);border:1px solid rgba(164,172,209,.22);border-radius:14px;padding:16px 16px 12px;box-shadow:0 24px 50px rgba(10,5,18,.55);backdrop-filter:blur(6px)}
.card header{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px}
.card header b{display:flex;gap:8px;align-items:center}
.chip{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.08em;color:#4FD1A5;background:rgba(79,209,165,.14);padding:3px 8px;border-radius:999px}
.card .ch{height:92px;margin:8px 0 6px}
.card footer{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:8.5px;color:#B9B2CC;border-top:1px dashed rgba(164,172,209,.2);padding-top:8px}
</style></head><body>
%%DEFS%%
<div class="c">
  <svg class="pat" width="100%" height="100%"><rect width="100%" height="100%" fill="url(#pat)"/></svg>
  <svg class="mark"><use href="#mark" fill="url(#gBrandDiag)"/></svg>
  <div class="top"><span class="mono">Brand Identity</span><span class="mono">2026 · Tunisia</span></div>
  <h1>Tunisia<br>Crypto <span>Signals</span></h1>
  <div class="foot"><i>Logo</i><i>Guidelines</i><i>Mockups</i></div>
  <div class="card">
    <header><b><svg width="24" height="14"><use href="#crown" fill="#A4ACD1"/></svg>BTC / USDT</b><span class="chip">▲ LONG</span></header>
    <div class="ch"><svg viewBox="0 0 600 300" preserveAspectRatio="none" width="100%" height="100%"><use href="#chart"/></svg></div>
    <footer><span>#128 · 4H</span><span>Signals with a strategy</span></footer>
  </div>
</div>
</body></html>
