.tee{position:absolute;left:640px;top:170px;width:640px;height:720px}

.roll .ph{position:absolute;left:30px;right:30px;top:500px;height:250px;border-radius:30px;overflow:hidden;border:6px solid #fff}
.roll .ph img{width:100%;height:100%;object-fit:cover}
.roll .url{position:absolute;left:0;right:0;bottom:30px;text-align:center;font:900 26px Nunito;color:#fff;direction:ltr}
.roll .stripe{position:absolute;left:0;right:0;bottom:0;height:12px}
.floor{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(0,70,100,.35),transparent 70%);filter:blur(10px)}
