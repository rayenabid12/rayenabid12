<!doctype html><html dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="mk.css">
<style>
body{background:#FFE3EC}
.sheet{position:absolute;left:170px;top:110px;width:820px;height:860px;background:#FFFDF9;border-radius:24px;transform:rotate(-3deg)}
.cut{position:absolute;filter:drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff) drop-shadow(4px 4px 0 #fff) drop-shadow(-4px -4px 0 #fff) drop-shadow(0 6px 8px rgba(80,20,40,.18))}
.badge{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 0 8px #fff,0 8px 16px rgba(80,20,40,.18)}

.peel .curl{position:absolute;right:-60px;bottom:-60px;width:300px;height:300px;border-radius:50%;background:linear-gradient(135deg,#FFE3EC 49%,#fff 50%,#e9e4e6 100%);box-shadow:-10px -10px 30px rgba(0,0,0,.15)}
.lbl{position:absolute;font:800 18px Nunito;letter-spacing:.2em;color:#B4506F;direction:ltr}
