<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&family=Nunito:wght@800;900&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:808px;height:632px;overflow:hidden}
body{background:#00CCFF url(../../brand/pattern/tile-cyan-mono.svg) 0 0/220px;position:relative;font-family:Nunito}
.glow{position:absolute;left:50%;top:46%;width:620px;height:420px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.35),transparent 65%)}
.logo{position:absolute;left:50%;top:44%;width:520px;transform:translate(-50%,-50%) rotate(-4deg);filter:drop-shadow(0 18px 24px rgba(0,70,100,.35))}
.cut{position:absolute;filter:drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(0 10px 12px rgba(0,60,90,.3))}
.bar{position:absolute;left:0;right:0;bottom:0;height:96px;background:#231F20;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.bar b{font:900 30px Nunito;color:#FFF8EC;letter-spacing:.5px}
.bar span{font:800 28px 'Baloo Bhaijaan 2';color:#FFCC0D}
.stripe{position:absolute;left:0;right:0;bottom:96px;height:8px;display:flex}.stripe i{flex:1}
</style></head><body>
<div class="glow"></div>
<img class="cut" src="../../brand/icons/face.svg" style="left:40px;top:40px;width:120px;transform:rotate(-12deg)">
<img class="cut" src="../../brand/icons/heart-pink.svg" style="right:52px;top:44px;width:96px;transform:rotate(14deg)">
<img class="cut" src="../../brand/icons/hand-purple.svg" style="right:60px;top:330px;width:110px;transform:rotate(12deg)">
<img class="cut" src="../../brand/icons/heart-yellow.svg" style="left:62px;top:356px;width:76px;transform:rotate(-16deg)">
<img class="logo" src="../../brand/logo/logo-color-sticker.svg">
<div class="stripe"><i style="background:#B130D0"></i><i style="background:#FFCC0D"></i><i style="background:#CCCC0D"></i><i style="background:#FF9922"></i><i style="background:#FF669B"></i></div>
<div class="bar"><b>BRAND IDENTITY</b><span>هوية بصرية</span></div>
</body></html>
