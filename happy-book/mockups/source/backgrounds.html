<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="mk.css">
<style>html,body{width:1664px;height:640px;background:transparent}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.t{height:300px;border-radius:24px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.t img{width:300px;position:relative}
.ok{position:absolute;right:18px;top:18px;width:48px;height:48px;border-radius:50%;background:#1FA463;display:flex;align-items:center;justify-content:center}
.ok::after{content:"";width:12px;height:22px;border:solid #fff;border-width:0 5px 5px 0;transform:rotate(45deg) translate(-2px,-2px)}
</style></head><body><div class="g">
<div class="t" style="background:#FFF8EC"><img src="../../brand/logo/logo-color.svg"><i class="ok"></i></div>
<div class="t" style="background:#00CCFF"><img src="../../brand/logo/logo-color.svg"><i class="ok"></i></div>
<div class="t" style="background:#B130D0"><img src="../../brand/logo/logo-color-sticker.svg"><i class="ok"></i></div>
<div class="t" style="background:#231F20"><img src="../../brand/logo/logo-color-sticker.svg"><i class="ok"></i></div>
<div class="t" style="background:#00CCFF"><img src="../../brand/logo/logo-white.svg"><i class="ok"></i></div>
<div class="t" style="background:#B130D0"><img src="../../brand/logo/logo-white.svg"><i class="ok"></i></div>
<div class="t" style="background:#FFCC0D"><img src="../../brand/logo/logo-ink.svg"><i class="ok"></i></div>
<div class="t pat-cyan-mono" style="background-size:260px"><img src="../../brand/logo/logo-color-sticker.svg"><i class="ok"></i></div>
</div></body></html>
