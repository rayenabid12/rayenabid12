<!doctype html><html dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="mk.css">
<style>
body{background:linear-gradient(180deg,#FFF6E6 0%,#FBEBD3 74%,#E9CFAE 74%,#DDBF99 100%)}
.wall{position:absolute;left:0;right:0;top:0;height:74%;background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.7),transparent 60%)}
.sign{position:absolute;left:50%;top:70px;width:740px;transform:translateX(-50%)}
.sign img{width:100%;filter:drop-shadow(1px 1px 0 #15121a) drop-shadow(1px 1px 0 #15121a) drop-shadow(1px 1px 0 #15121a) drop-shadow(1px 1px 0 #15121a) drop-shadow(1px 1px 0 #15121a) drop-shadow(1px 1px 0 #15121a) drop-shadow(18px 26px 18px rgba(90,50,10,.35))}
.light{position:absolute;left:50%;top:0;width:1300px;height:900px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 0%,rgba(255,240,200,.55),transparent 60%)}
.shelf{position:absolute;left:330px;right:330px;top:748px;height:30px;background:linear-gradient(180deg,#F7F1E8,#D8CFC2);border-radius:4px;box-shadow:0 20px 30px rgba(90,50,10,.25)}
.bk{position:absolute;bottom:332px;width:150px;border-radius:8px 3px 3px 8px;box-shadow:inset -8px 0 0 rgba(0,0,0,.12),0 8px 16px rgba(90,50,10,.2);display:flex;align-items:flex-end;justify-content:center;padding-bottom:20px;font:800 24px/1.2 'Baloo Bhaijaan 2';text-align:center}
.box{position:absolute;bottom:332px;width:200px;height:240px;border-radius:6px;background:var(--cyan);box-shadow:inset -14px 0 0 rgba(0,0,0,.1),0 8px 16px rgba(90,50,10,.2);overflow:hidden}
.plant{position:absolute;left:150px;top:520px;width:120px;height:240px}
.plant .pot{position:absolute;bottom:0;left:15px;width:90px;height:90px;border-radius:0 0 30px 30px;background:var(--pink)}
.plant .lf{position:absolute;width:40px;height:110px;border-radius:50%;background:#4E9A63;transform-origin:50% 100%}
</style></head><body class="grain">
<div class="wall"></div><div class="light"></div>
<div class="sign"><img src="../../brand/logo/logo-color.svg"></div>
<div class="bk" style="left:430px;height:250px;background:var(--yellow)">ألواني<br>الأولى</div>
<div class="bk" style="left:590px;height:262px;background:var(--pink)">مشاعري<br>الصغيرة</div>
<div class="box" style="left:760px"><div class="pat-cyan-mono" style="position:absolute;inset:0"></div><img src="../../brand/logo/logo-color-sticker.svg" style="position:absolute;left:20px;top:30px;width:160px"></div>
<div class="bk" style="left:980px;height:230px;background:var(--cyan)">أرقامي</div>
<div class="box" style="left:1150px;width:180px;height:200px;background:var(--purple)"><div class="pat-purple-mono" style="position:absolute;inset:0"></div><img src="../../brand/logo/logo-color-sticker.svg" style="position:absolute;left:18px;top:40px;width:144px"></div>
<div class="bk" style="left:1350px;height:260px;width:130px;background:var(--lime)">قصص<br>قبل النوم</div>
<div class="shelf"></div>
</body></html>
