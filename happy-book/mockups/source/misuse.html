<!doctype html><html dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="mk.css">
<style>html,body{width:1664px;height:700px;background:transparent}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.t{height:330px;border-radius:24px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.t img.l{width:300px}
.no{position:absolute;right:20px;top:20px;width:52px;height:52px;border-radius:50%;background:#E5322D;display:flex;align-items:center;justify-content:center}
.no::before,.no::after{content:"";position:absolute;width:26px;height:5px;border-radius:3px;background:#fff;transform:rotate(45deg)}.no::after{transform:rotate(-45deg)}
.cap{position:absolute;right:24px;left:24px;bottom:18px;font:700 26px Tajawal;color:#231F20;text-align:right}
</style></head><body><div class="g">
<div class="t" style="background:#F1ECE4"><img class="l" src="../../brand/logo/logo-color.svg" style="transform:scaleX(1.45) scaleY(.8)"><div class="no"></div><div class="cap">لا تمدّد الشعار أو تضغطه</div></div>
<div class="t" style="background:#F1ECE4"><img class="l" src="../../brand/logo/logo-color.svg" style="filter:hue-rotate(140deg) saturate(.8)"><div class="no"></div><div class="cap">لا تغيّر ألوان الحروف</div></div>
<div class="t" style="background:#F1ECE4"><img class="l" src="../../brand/logo/logo-color.svg" style="transform:rotate(-22deg)"><div class="no"></div><div class="cap">لا تُدِر الشعار</div></div>
<div class="t" style="background:#FFCC0D"><img class="l" src="../../brand/logo/logo-white.svg"><div class="no"></div><div class="cap">لا تستعمل الأبيض على خلفية فاتحة</div></div>
<div class="t" style="background:#F1ECE4"><img class="l" src="../../brand/logo/logo-color.svg" style="filter:drop-shadow(14px 18px 6px rgba(0,0,0,.55)) blur(.6px)"><div class="no"></div><div class="cap">لا تُضِف ظلالاً أو مؤثرات</div></div>
<div class="t"><img src="../../brand/photos/cards-flatlay.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"><img class="l" src="../../brand/logo/logo-white.svg" style="position:relative;opacity:.95"><div class="no"></div><div class="cap" style="color:#fff">لا تضعه على صورة مزدحمة</div></div>
</div></body></html>
